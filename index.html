<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#16231c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zettel">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>Einkaufszettel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16231c;
    --surface:#1e3327;
    --surface2:#24402f;
    --line:#31503b;
    --accent:#e7a94c;
    --accent2:#c2542b;
    --text:#f3efe1;
    --muted:#93a794;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Karla', sans-serif;
    padding-bottom:calc(48px + env(safe-area-inset-bottom, 10px));
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(231,169,76,0.08), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(194,84,43,0.07), transparent 40%),
      var(--bg);
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}
  .hidden{display:none !important;}

  /* ---------- Header (shared) ---------- */
  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(var(--bg) 82%, transparent);
    padding:calc(18px + env(safe-area-inset-top, 24px)) 0 10px;
  }
  header.top .row{display:flex; align-items:center; justify-content:space-between; padding:0 16px; gap:10px;}
  header.top h1{font-size:28px; font-weight:700; letter-spacing:0.2px; display:flex; align-items:center; gap:10px;}
  header.top h1 span.accentword{color:var(--accent);}
  .count{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--muted); flex-shrink:0;}
  .backbtn{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .editbtn{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    font-family:'Karla', sans-serif; font-weight:600; font-size:13px;
    padding:8px 14px; border-radius:16px; cursor:pointer;
  }
  .editbtn.on{color:var(--accent2); border-color:var(--accent2);}
  .syncstatus{
    display:none; align-items:center; gap:6px; font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; color:var(--accent2); flex-shrink:0;
  }
  .syncstatus.show{display:flex;}
  .syncstatus .pulse{
    width:7px; height:7px; border-radius:50%; background:var(--accent2);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}

  /* ---------- Overview: list of lists ---------- */
  .liststack{display:flex; flex-direction:column; gap:14px; padding:6px 16px 40px;}
  .listcard{
    border-radius:22px; padding:22px 20px; position:relative; overflow:hidden;
    cursor:pointer; min-height:100px; border:1px solid rgba(255,255,255,0.07);
  }
  .listcard .top{display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:2;}
  .listcard h3{font-size:23px; font-weight:600; color:var(--text);}
  .listcard .badge{
    background:rgba(0,0,0,0.3); color:var(--text); font-family:'IBM Plex Mono', monospace;
    font-size:12px; padding:4px 10px; border-radius:14px; white-space:nowrap; flex-shrink:0;
  }
  .listcard .icon-big{position:absolute; right:10px; bottom:-6px; font-size:52px; opacity:0.28; z-index:1;}
  .listcard .del{
    position:absolute; top:12px; left:12px; background:var(--accent2); color:#fff;
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:15px; z-index:3; border:0; cursor:pointer;
  }
  .listcard.editing{padding-left:46px;}
  .listcard .reorder{
    position:absolute; top:12px; right:12px; display:flex; gap:6px; z-index:3;
  }
  .listcard .reorder button{
    width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.32);
    color:var(--text); border:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer; padding:0;
  }
  .listcard .reorder button:disabled{opacity:0.25; pointer-events:none;}
  .listcard .sub{font-family:'Karla',sans-serif; font-size:12.5px; color:rgba(243,239,225,0.65); margin-top:4px; position:relative; z-index:2;}

  .addlistcard{
    border:2px dashed var(--line); border-radius:22px; padding:20px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    color:var(--muted); cursor:pointer; font-family:'Karla',sans-serif; font-weight:600; font-size:15px;
  }
  .newlistform{
    display:flex; gap:8px; margin-top:2px;
  }
  .newlistform input{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    color:var(--text); font-family:'Karla',sans-serif; font-size:16px; padding:12px 14px; outline:0;
  }
  .newlistform button{
    background:var(--accent); color:#1b2b1f; border:0; border-radius:14px; padding:0 18px;
    font-family:'Karla',sans-serif; font-weight:700; cursor:pointer;
  }

  /* ---------- Detail screen ---------- */
  .searchbar{padding:10px 16px 0;}
  .searchbox{
    position:relative; display:flex; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:4px 4px 4px 14px;
  }
  .searchbox input{
    flex:1; background:transparent; border:0; outline:0; color:var(--text);
    font-family:'Karla', sans-serif; font-size:16px; padding:10px 6px;
  }
  .searchbox input::placeholder{color:var(--muted);}
  .searchbox button{
    background:var(--accent); color:#1b2b1f; border:0; border-radius:10px;
    font-family:'Karla', sans-serif; font-weight:700; font-size:14px;
    padding:10px 14px; cursor:pointer;
  }
  .suggestions{
    background:var(--surface); border:1px solid var(--line); border-top:0;
    border-radius:0 0 14px 14px; overflow:hidden; margin:-1px 16px 0;
  }
  .suggestion{
    display:flex; align-items:center; gap:10px; padding:11px 14px;
    border-top:1px solid var(--line); cursor:pointer; font-size:15px;
  }
  .suggestion:active{background:var(--surface2);}
  .suggestion .cat{margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted);}
  .suggestion.add-new{color:var(--accent);}

  section{padding:18px 16px 0;}
  .section-title{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .section-title h2{font-size:15px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); font-weight:600; font-family:'Karla',sans-serif;}
  .section-title .line{flex:1; height:1px; background:var(--line);}

  .cat-group{margin-bottom:18px;}
  .cat-label{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted);
    margin:0 0 6px 2px; display:flex; align-items:center; gap:6px;
  }
  .list-items{list-style:none; margin:0; padding:0; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);}
  .list-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); padding:13px 12px; border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:0;}
  .list-item .dot{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--accent);
    flex-shrink:0; position:relative; cursor:pointer;
  }
  .list-item.done .dot{background:var(--accent); border-color:var(--accent);}
  .list-item.done .dot::after{
    content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#1b2b1f; font-weight:700;
  }
  .list-item .icon{font-size:19px; width:22px; text-align:center; flex-shrink:0;}
  .list-item .name{flex:1; font-size:16px; position:relative; cursor:pointer;}
  .list-item.done .name{color:var(--muted);}
  .list-item .strike{
    position:absolute; left:-2px; right:-2px; top:50%; height:2px;
    background:var(--accent2); transform:scaleX(0); transform-origin:left;
    transition:transform 0.32s cubic-bezier(.6,0,.2,1); border-radius:2px;
    box-shadow:0 3px 0 -1px rgba(194,84,43,0.35);
  }
  .list-item.done .strike{transform:scaleX(1) rotate(-0.6deg);}
  .qty{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--accent);
    background:rgba(231,169,76,0.12); border:1px solid rgba(231,169,76,0.35);
    border-radius:20px; padding:3px 9px; cursor:pointer; flex-shrink:0;
  }
  .remove{
    background:transparent; border:0; color:var(--muted); font-size:18px; line-height:1;
    padding:4px 2px; cursor:pointer; flex-shrink:0;
  }
  .move{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer; flex-shrink:0; padding:0;
  }
  .move:active{background:var(--surface2); color:var(--accent);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--surface); border:1px solid var(--line); border-bottom:0;
    border-radius:22px 22px 0 0; width:100%; max-width:640px; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 10px));
    max-height:70vh; overflow-y:auto;
  }
  .modal-title{
    font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin-bottom:12px; color:var(--text);
  }
  .modal-option{
    display:flex; align-items:center; gap:10px; padding:13px 10px; border-radius:14px;
    cursor:pointer; font-size:16px;
  }
  .modal-option:active{background:var(--surface2);}
  .modal-option .swatch{width:12px; height:12px; border-radius:50%; flex-shrink:0;}
  .modal-empty{color:var(--muted); font-size:14px; padding:10px 2px 16px;}
  .modal-cancel{
    display:block; width:100%; margin-top:8px; background:transparent; color:var(--muted);
    border:1px solid var(--line); border-radius:14px; padding:12px; font-size:15px;
    font-family:'Karla',sans-serif; font-weight:600; cursor:pointer;
  }

  .empty{
    color:var(--muted); font-size:14px; padding:18px 4px; text-align:center;
    border:1px dashed var(--line); border-radius:var(--radius);
  }

  .clear-btn{
    display:block; margin:10px auto 0; background:transparent; color:var(--muted);
    border:1px solid var(--line); border-radius:20px; padding:7px 16px; font-size:13px;
    font-family:'Karla', sans-serif; cursor:pointer;
  }

  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; font-size:13px; font-family:'Karla',sans-serif; font-weight:600;
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    padding:8px 14px; border-radius:20px; cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--accent); border-color:var(--accent); color:#1b2b1f;}

  .grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; margin-top:12px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 8px; text-align:center; cursor:pointer;
  }
  .card:active{background:var(--surface2);}
  .card.in-list{border-color:var(--accent); background:rgba(231,169,76,0.08);}
  .card .icon{font-size:24px; display:block; margin-bottom:6px;}
  .card .name{font-size:12.5px; line-height:1.25; display:block;}

  footer{text-align:center; color:var(--line); font-family:'IBM Plex Mono', monospace; font-size:11px; padding:30px 0 10px;}
</style>
</head>
<body>

<!-- ============ OVERVIEW SCREEN ============ -->
<div id="screenOverview">
  <header class="top">
    <div class="row">
      <h1>Meine <span class="accentword">Listen</span></h1>
      <span class="syncstatus" id="syncStatus1"><span class="pulse"></span>offline</span>
      <button class="editbtn" id="editToggle">Bearbeiten</button>
    </div>
  </header>
  <div class="liststack" id="liststack"></div>
</div>

<!-- ============ DETAIL SCREEN ============ -->
<div id="screenDetail" class="hidden">
  <header class="top">
    <div class="row">
      <button class="backbtn" id="backBtn">‹</button>
      <h1 id="detailTitle" style="font-size:22px; flex:1;">Liste</h1>
      <span class="syncstatus" id="syncStatus2"><span class="pulse"></span>offline</span>
      <div class="count" id="openCount">0 offen</div>
    </div>
  </header>

  <div class="searchbar">
    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="Artikel suchen oder hinzufügen…" autocomplete="off">
      <button id="addBtn">Hinzufügen</button>
    </div>
    <div class="suggestions" id="suggestions" style="display:none;"></div>
  </div>

  <section>
    <div class="section-title"><h2>Auf dem Zettel</h2><div class="line"></div></div>
    <div id="openList"></div>
  </section>

  <section id="doneSection" style="display:none;">
    <div class="section-title"><h2>Erledigt</h2><div class="line"></div></div>
    <ul class="list-items" id="doneList"></ul>
    <button class="clear-btn" id="clearBtn">Erledigte entfernen</button>
  </section>

  <section>
    <div class="section-title"><h2>Vorrat durchstöbern</h2><div class="line"></div></div>
    <div class="chips" id="catChips"></div>
    <div class="grid" id="dbGrid"></div>
  </section>

  <footer>für zwei · geteilter Zettel</footer>
</div>

<div class="modal-overlay hidden" id="moveModal">
  <div class="modal-sheet">
    <div class="modal-title">Verschieben nach…</div>
    <div id="moveListOptions"></div>
    <button class="modal-cancel" id="moveCancel">Abbrechen</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

].map(([n,c,i])=>({n,c,i}));

const QTY_STEPS = [1,2,3,4,5,6,8,10];
const CARD_COLORS = ['#28422f','#3a2c20','#233a45','#402a2a','#2c3a2c','#33283f','#2f3c40','#413027'];

const STORE_ICON_RULES = [
  [['wochenmarkt','markt'],'🧺'],
  [['gewürz','gewuerz'],'🧂'],
  [['getränke','getraenke'],'🥤'],
  [['obi','hornbach','bauhaus','toom','baumarkt'],'🔨'],
  [['rossmann','dm','budni','müller','muller','drogerie'],'🧴'],
  [['lidl','aldi','edeka','rewe','netto','real','kaufland','penny','famila'],'🛒'],
];
function guessIcon(name){
  const q = name.toLowerCase();
  for(const [keys,icon] of STORE_ICON_RULES){
    if(keys.some(k=>q.includes(k))) return icon;
  }
  return '🛍️';
}

let lists = [];        // {id,name,icon,color,createdAt}
let items = [];        // {id,listId,n,c,i,checked,qty}
let custom = [];       // {n,c,i}
let currentListId = null;
let activeCat = null;
let editMode = false;
let searchTimer = null;

const $ = sel => document.querySelector(sel);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function allDbItems(){ return MASTER.concat(custom); }
function currentItems(){ return items.filter(x=>x.listId===currentListId); }

// ---------- storage: Firebase Firestore (geräteübergreifend, mit eingebauter Offline Warteschlange) ----------
const firebaseConfig = {
  apiKey: "AIzaSyAsHEUsZYL8jjse5EdxfeDy_JDs6PKymVU",
  authDomain: "einkaufszettel-96464.firebaseapp.com",
  projectId: "einkaufszettel-96464",
  storageBucket: "einkaufszettel-96464.firebasestorage.app",
  messagingSenderId: "814763930088",
  appId: "1:814763930088:web:b2b3301a535846ff9d345d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* z. B. mehrere Tabs offen, unkritisch */ }

const listsRef = db.collection('einkaufszettel').doc('lists');
const itemsRef = db.collection('einkaufszettel').doc('items');
const customRef = db.collection('einkaufszettel').doc('custom');

function updateSyncStatus(){
  const isOffline = !navigator.onLine;
  [$('#syncStatus1'), $('#syncStatus2')].forEach(el => { if(el) el.classList.toggle('show', isOffline); });
}
function isTyping(){
  return document.activeElement && (document.activeElement.id === 'searchInput' || document.activeElement.id === 'newListInput');
}

async function saveLists(){ try{ await listsRef.set({value:lists}); }catch(e){} }
async function saveItems(){ try{ await itemsRef.set({value:items}); }catch(e){} }
async function saveCustom(){ try{ await customRef.set({value:custom}); }catch(e){} }

async function loadAll(){
  try{
    const snap = await listsRef.get();
    const existing = snap.exists ? (snap.data().value || []) : [];
    if(existing.length === 0){
      lists = [{id:uid(), name:'Einkaufsliste', icon:'🛍️', color:CARD_COLORS[0], createdAt:Date.now()}];
      await saveLists();
    }
  }catch(e){ /* offline beim allerersten Start ohne lokalen Cache, wartet auf Verbindung */ }

  listsRef.onSnapshot(snap => {
    lists = snap.exists ? (snap.data().value || []) : [];
    if(isTyping()) return;
    if(currentListId && !lists.find(l=>l.id===currentListId)) { showOverview(); return; }
    if(currentListId){ const l = lists.find(x=>x.id===currentListId); if(l) $('#detailTitle').textContent = l.name; }
    if(!currentListId) renderOverview(); else render();
  });
  itemsRef.onSnapshot(snap => {
    items = snap.exists ? (snap.data().value || []) : [];
    if(isTyping()) return;
    if(currentListId) render(); else renderOverview();
  });
  customRef.onSnapshot(snap => {
    custom = snap.exists ? (snap.data().value || []) : [];
    if(isTyping()) return;
    if(currentListId) render();
  });

  updateSyncStatus();
  renderOverview();
}

// ---------- navigation ----------
function showOverview(){
  currentListId = null;
  $('#screenDetail').classList.add('hidden');
  $('#screenOverview').classList.remove('hidden');
  renderOverview();
}
function openList(id){
  currentListId = id;
  const l = lists.find(x=>x.id===id);
  if(!l) return;
  $('#detailTitle').textContent = l.name;
  $('#screenOverview').classList.add('hidden');
  $('#screenDetail').classList.remove('hidden');
  activeCat = null;
  render();
}

// ---------- list CRUD ----------
async function createList(name){
  const n = name.trim();
  if(!n) return;
  const color = CARD_COLORS[lists.length % CARD_COLORS.length];
  const l = {id:uid(), name:n, icon:guessIcon(n), color, createdAt:Date.now()};
  lists.push(l);
  await saveLists();
  renderOverview();
}
async function deleteList(id){
  lists = lists.filter(x=>x.id!==id);
  items = items.filter(x=>x.listId!==id);
  await saveLists();
  await saveItems();
  renderOverview();
}
function moveListUp(id){
  const i = lists.findIndex(l=>l.id===id);
  if(i <= 0) return;
  [lists[i-1], lists[i]] = [lists[i], lists[i-1]];
  saveLists(); renderOverview();
}
function moveListDown(id){
  const i = lists.findIndex(l=>l.id===id);
  if(i === -1 || i >= lists.length-1) return;
  [lists[i+1], lists[i]] = [lists[i], lists[i+1]];
  saveLists(); renderOverview();
}

// ---------- item logic ----------
function findInDb(name){
  const q = name.trim().toLowerCase();
  return allDbItems().find(it => it.n.toLowerCase() === q);
}
function addToList(name, cat, icon){
  const existingOpen = currentItems().find(it => it.n.toLowerCase() === name.toLowerCase() && !it.checked);
  if(existingOpen) return;
  const existingDone = currentItems().find(it => it.n.toLowerCase() === name.toLowerCase() && it.checked);
  if(existingDone){ existingDone.checked = false; saveItems(); render(); return; }
  items.push({id:uid(), listId:currentListId, n:name, c:cat||'sonstiges', i:icon||'📝', checked:false, qty:1});
  saveItems(); render();
}
function addCustomAndList(name){
  const n = name.trim();
  if(!n) return;
  if(!findInDb(n)){ custom.push({n, c:'sonstiges', i:'📝'}); saveCustom(); }
  const db = findInDb(n);
  addToList(n, db.c, db.i);
}
function toggleCheck(id){
  const it = items.find(x=>x.id===id); if(!it) return;
  it.checked = !it.checked; saveItems(); render();
}
function cycleQty(id){
  const it = items.find(x=>x.id===id); if(!it) return;
  const i = QTY_STEPS.indexOf(it.qty);
  it.qty = QTY_STEPS[(i+1) % QTY_STEPS.length];
  saveItems(); render();
}
function removeItem(id){
  items = items.filter(x=>x.id!==id); saveItems(); render();
}
let moveItemId = null;
function openMoveModal(itemId){
  moveItemId = itemId;
  const targets = lists.filter(l => l.id !== currentListId);
  const box = $('#moveListOptions');
  if(targets.length === 0){
    box.innerHTML = `<div class="modal-empty">Es gibt noch keine weitere Liste. Leg unter „Meine Listen" erst eine zweite Liste an.</div>`;
  }else{
    box.innerHTML = targets.map(l => `
      <div class="modal-option" data-movetarget="${l.id}">
        <span class="swatch" style="background:${l.color}"></span>
        <span>${l.icon} ${l.name}</span>
      </div>`).join('');
  }
  $('#moveModal').classList.remove('hidden');
}
function closeMoveModal(){
  moveItemId = null;
  $('#moveModal').classList.add('hidden');
}
function moveItemToList(itemId, targetListId){
  const it = items.find(x=>x.id===itemId);
  if(!it) return;
  it.listId = targetListId;
  it.checked = false;
  saveItems(); render();
}
function clearDone(){
  items = items.filter(x=> !(x.listId===currentListId && x.checked));
  saveItems(); render();
}

// ---------- render: overview ----------
function renderOverview(){
  const box = $('#liststack');
  const cards = lists.map((l, idx) => {
    const count = items.filter(x=>x.listId===l.id && !x.checked).length;
    return `
    <div class="listcard ${editMode?'editing':''}" style="background:${l.color}" data-open="${l.id}">
      ${editMode ? `<button class="del" data-del="${l.id}">×</button>` : ''}
      ${editMode ? `
        <div class="reorder">
          <button data-moveup="${l.id}" ${idx===0?'disabled':''}>▲</button>
          <button data-movedown="${l.id}" ${idx===lists.length-1?'disabled':''}>▼</button>
        </div>` : ''}
      <div class="top">
        <h3>${l.name}</h3>
        <span class="badge">${count} ${count===1?'Artikel':'Artikel'}</span>
      </div>
      <div class="sub">antippen zum Öffnen</div>
      <div class="icon-big">${l.icon}</div>
    </div>`;
  }).join('');
  box.innerHTML = cards + `
    <div class="addlistcard" id="showNewListForm">＋ Neue Liste</div>
    <div class="newlistform hidden" id="newListForm">
      <input id="newListInput" type="text" placeholder="z. B. Edeka, Wochenmarkt…" autocomplete="off">
      <button id="createListBtn">Erstellen</button>
    </div>
  `;
  $('#editToggle').textContent = editMode ? 'Fertig' : 'Bearbeiten';
  $('#editToggle').classList.toggle('on', editMode);
}

// ---------- render: detail ----------
function renderSuggestions(query){
  const box = $('#suggestions');
  const q = query.trim().toLowerCase();
  if(!q){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = allDbItems().filter(it => it.n.toLowerCase().includes(q)).slice(0,7);
  let html = matches.map(it => `
    <div class="suggestion" data-add="${it.n.replace(/"/g,'&quot;')}">
      <span>${it.i}</span><span>${it.n}</span>
      <span class="cat">${catMap[it.c].n}</span>
    </div>`).join('');
  const exact = matches.some(it => it.n.toLowerCase() === q);
  if(!exact){
    html += `<div class="suggestion add-new" data-addnew="${query.trim().replace(/"/g,'&quot;')}">
      <span>➕</span><span>„${query.trim()}" hinzufügen</span></div>`;
  }
  box.innerHTML = html;
  box.style.display = html ? 'block' : 'none';
}

function render(){
  if(!currentListId) return;
  const cur = currentItems();
  const open = cur.filter(x=>!x.checked);
  const done = cur.filter(x=>x.checked);
  $('#openCount').textContent = `${open.length} offen`;

  const openList = $('#openList');
  if(!open.length){
    openList.innerHTML = `<div class="empty">Noch nichts auf dem Zettel. Unten etwas suchen oder aus dem Vorrat tippen.</div>`;
  }else{
    const byCat = {};
    open.forEach(it => { (byCat[it.c] = byCat[it.c]||[]).push(it); });
    openList.innerHTML = CATS.filter(c=>byCat[c.k]).map(c => `
      <div class="cat-group">
        <div class="cat-label">${c.i} ${c.n}</div>
        <ul class="list-items">${byCat[c.k].map(it => rowHtml(it)).join('')}</ul>
      </div>`).join('');
  }

  const doneSection = $('#doneSection');
  if(done.length){
    doneSection.style.display = 'block';
    $('#doneList').innerHTML = done.map(it => rowHtml(it)).join('');
  }else{
    doneSection.style.display = 'none';
  }

  renderChips();
  renderGrid();
}

function rowHtml(it){
  return `
    <li class="list-item ${it.checked?'done':''}" data-id="${it.id}">
      <span class="dot" data-toggle="${it.id}"></span>
      <span class="icon">${it.i}</span>
      <span class="name" data-toggle="${it.id}">${it.n}<span class="strike"></span></span>
      <span class="qty" data-qty="${it.id}" style="${it.qty>1?'':'opacity:.55'}">×${it.qty}</span>
      <button class="move" data-move="${it.id}" title="Verschieben">⇄</button>
      <button class="remove" data-remove="${it.id}">×</button>
    </li>`;
}

function renderChips(){
  const box = $('#catChips');
  box.innerHTML = CATS.filter(c => allDbItems().some(it=>it.c===c.k)).map(c => `
    <div class="chip ${activeCat===c.k?'active':''}" data-cat="${c.k}">${c.i} ${c.n}</div>
  `).join('');
}
function renderGrid(){
  const grid = $('#dbGrid');
  const cat = activeCat || CATS[0].k;
  const dbItems = allDbItems().filter(it => it.c === cat);
  const inListNames = new Set(currentItems().filter(x=>!x.checked).map(x=>x.n.toLowerCase()));
  grid.innerHTML = dbItems.map(it => `
    <div class="card ${inListNames.has(it.n.toLowerCase())?'in-list':''}" data-add="${it.n.replace(/"/g,'&quot;')}" data-c="${it.c}" data-i="${it.i}">
      <span class="icon">${it.i}</span><span class="name">${it.n}</span>
    </div>`).join('');
}

// ---------- events: overview ----------
$('#editToggle').addEventListener('click', () => { editMode = !editMode; renderOverview(); });
$('#backBtn').addEventListener('click', showOverview);

document.body.addEventListener('click', e => {
  // overview: open list
  const openCard = e.target.closest('.listcard[data-open]');
  if(openCard && !e.target.closest('[data-del]') && !e.target.closest('[data-moveup]') && !e.target.closest('[data-movedown]')){
    if(!editMode) openList(openCard.dataset.open);
    return;
  }
  const delBtn = e.target.closest('[data-del]');
  if(delBtn){ deleteList(delBtn.dataset.del); return; }
  const upBtn = e.target.closest('[data-moveup]');
  if(upBtn){ moveListUp(upBtn.dataset.moveup); return; }
  const downBtn = e.target.closest('[data-movedown]');
  if(downBtn){ moveListDown(downBtn.dataset.movedown); return; }

  const showForm = e.target.closest('#showNewListForm');
  if(showForm){
    $('#showNewListForm').classList.add('hidden');
    $('#newListForm').classList.remove('hidden');
    $('#newListInput').focus();
    return;
  }
  const createBtn = e.target.closest('#createListBtn');
  if(createBtn){
    const v = $('#newListInput').value;
    if(v.trim()){ createList(v); }
    return;
  }

  // detail: toggle / qty / remove / add-card / chip
  const t = e.target.closest('[data-toggle]');
  if(t){ toggleCheck(t.dataset.toggle); return; }
  const q = e.target.closest('[data-qty]');
  if(q){ cycleQty(q.dataset.qty); return; }
  const r = e.target.closest('[data-remove]');
  if(r){ removeItem(r.dataset.remove); return; }
  const mv = e.target.closest('[data-move]');
  if(mv){ openMoveModal(mv.dataset.move); return; }
  const mvt = e.target.closest('[data-movetarget]');
  if(mvt){ moveItemToList(moveItemId, mvt.dataset.movetarget); closeMoveModal(); return; }
  if(e.target.id === 'moveCancel' || e.target.id === 'moveModal'){ closeMoveModal(); return; }
  const card = e.target.closest('.card[data-add]');
  if(card){ addToList(card.dataset.add, card.dataset.c, card.dataset.i); return; }
  const chip = e.target.closest('.chip[data-cat]');
  if(chip){ activeCat = chip.dataset.cat; renderChips(); renderGrid(); return; }
});
document.body.addEventListener('keydown', e => {
  if(e.target && e.target.id === 'newListInput' && e.key === 'Enter'){
    e.preventDefault();
    const v = e.target.value;
    if(v.trim()) createList(v);
  }
});

// ---------- events: detail search ----------
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(()=>renderSuggestions(v), 80);
});
$('#searchInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    const v = $('#searchInput').value.trim();
    if(!v) return;
    addCustomAndList(v);
    $('#searchInput').value=''; $('#suggestions').style.display='none';
  }
});
$('#addBtn').addEventListener('click', () => {
  const v = $('#searchInput').value.trim();
  if(!v) return;
  addCustomAndList(v);
  $('#searchInput').value=''; $('#suggestions').style.display='none';
});
$('#suggestions').addEventListener('click', e => {
  const s = e.target.closest('.suggestion');
  if(!s) return;
  if(s.dataset.add){ const db = findInDb(s.dataset.add); addToList(db.n, db.c, db.i); }
  else if(s.dataset.addnew){ addCustomAndList(s.dataset.addnew); }
  $('#searchInput').value=''; $('#suggestions').style.display='none';
});
document.addEventListener('click', e => {
  if(!e.target.closest('.searchbar')) $('#suggestions').style.display='none';
});
$('#clearBtn').addEventListener('click', clearDone);

// ---------- initial load + sync ----------
loadAll();

window.addEventListener('online', updateSyncStatus);
window.addEventListener('offline', updateSyncStatus);

// ---------- Wischgeste von links: zurück zur Listenübersicht ----------
let edgeSwipeActive = false;
let swipeStartX = 0, swipeStartY = 0;

document.addEventListener('touchstart', e => {
  if(e.touches.length !== 1) return;
  const t = e.touches[0];
  swipeStartX = t.clientX;
  swipeStartY = t.clientY;
  edgeSwipeActive = t.clientX < 24; // nur wenn der Wisch ganz am linken Rand beginnt
}, {passive:true});

document.addEventListener('touchmove', e => {
  if(!edgeSwipeActive || !currentListId) return;
  const t = e.touches[0];
  const dx = Math.max(0, Math.min(t.clientX - swipeStartX, 90));
  const dy = Math.abs(t.clientY - swipeStartY);
  if(dy < 60){
    $('#screenDetail').style.transform = `translateX(${dx}px)`;
    $('#screenDetail').style.opacity = String(1 - dx/220);
  }
}, {passive:true});

document.addEventListener('touchend', e => {
  if(!edgeSwipeActive){ return; }
  edgeSwipeActive = false;
  $('#screenDetail').style.transition = 'transform 0.2s ease, opacity 0.2s ease';
  $('#screenDetail').style.transform = '';
  $('#screenDetail').style.opacity = '';
  setTimeout(() => { $('#screenDetail').style.transition = ''; }, 220);
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStartX;
  const dy = Math.abs(t.clientY - swipeStartY);
  if(dx > 70 && dy < 60 && currentListId){
    showOverview();
  }
}, {passive:true});

// ---------- als WebApp installierbar machen ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
